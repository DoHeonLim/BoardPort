      - name: Run product trade migration integration test
        run: npm run test:migration:product-trade

      - name: Run Stream webhook migration integration test
        run: npm run test:migration:stream-webhook

      - name: Run VOD pagination migration integration test
        run: npm run test:migration:vod-pagination

      - name: Run type check
        run: npx tsc --noEmit

      - name: Run lint
        run: npm run lint

      # Vercel 배포 전에 production build 가능 여부를 CI에서 먼저 확인
      - name: Run production build
        run: npm run build
