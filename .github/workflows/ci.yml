name: CI

# develop은 통합 브랜치, master는 Vercel production branch 기준으로 검증
on:
  pull_request:
    branches:
      - develop
      - master
  push:
    branches:
      - develop
      - master

permissions:
  contents: read

# 같은 ref에 새 실행이 생기면 이전 CI를 취소해 불필요한 runner 사용 방지
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-database-smoke:
    name: Full Migration and Seed Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: boardport_release_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/boardport_release_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/boardport_release_test?schema=public
      RELEASE_MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/boardport_release_test?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 기존 상태를 가정하지 않는 빈 DB에서 전체 migration 순서와 최종 schema를 검증
      - name: Apply full migration chain
        run: npx prisma migrate deploy --config prisma.release-migration-test.config.ts

      - name: Confirm migration status
        run: npx prisma migrate status --config prisma.release-migration-test.config.ts

      # 실제 E2E fixture가 요구하는 관계·제약까지 생성하고 재실행 멱등성을 확인
      - name: Seed E2E smoke data
        id: seed
        run: |
          npm run seed:e2e
          npm run seed:e2e

      - name: Cleanup E2E smoke data
        if: always() && steps.seed.outcome == 'success'
        run: npm run cleanup:e2e

  quality:
    name: Unit, Type, Lint, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: boardport_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # build/type check가 참조하는 런타임 env를 placeholder로 채워 외부 서비스 호출 없이 검증
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public
      PUSH_MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/boardport_migration_test?schema=public
      REALTIME_MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/boardport_migration_test?schema=public
      MEDIA_MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/boardport_migration_test?schema=public
      AUTH_SESSION_MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/boardport_migration_test?schema=public
      REPORT_MODERATION_MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/boardport_migration_test?schema=public
      CHAT_IDEMPOTENCY_MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/boardport_migration_test?schema=public
      PRODUCT_TRADE_MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/boardport_migration_test?schema=public
      STREAM_WEBHOOK_MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/boardport_migration_test?schema=public
      VOD_PAGINATION_MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/boardport_migration_test?schema=public
      COOKIE_PASSWORD: ci-cookie-password-at-least-32-chars
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      CRON_SECRET: ci-cron-secret
      RATE_LIMIT_SALT: ci-rate-limit-salt-at-least-32-chars
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLIC_KEY: ci-supabase-public-key
      SUPABASE_SECRET_KEY: ci-supabase-secret-key
      SUPABASE_REALTIME_SIGNING_KEY_JWK: ci-realtime-signing-key-placeholder
      KAKAO_CLIENT_ID: ci-kakao-client-id
      KAKAO_CLIENT_SECRET: ci-kakao-client-secret
      KAKAO_REDIRECT_URI: http://127.0.0.1:3000/kakao/callback
      GITHUB_CLIENT_ID: ci-github-client-id
      GITHUB_CLIENT_SECRET: ci-github-client-secret
      COOLSMS_API_KEY: ci-coolsms-api-key
